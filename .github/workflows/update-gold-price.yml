name: 金価格データの自動更新

on:
  schedule:
    # 田中貴金属の当日最終公表（17:00 JST）の直後。UTC 08:40 = JST 17:40
    - cron: '40 8 * * 1-5'
    # LBMA の PM 建値（15:00 ロンドン時間）の公表後。UTC 16:30 = 翌 JST 01:30
    - cron: '30 16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gold-price
  cancel-in-progress: false

jobs:
  update:
    name: 価格データの取得と更新
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Python をセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 検証ロジックの自己テスト
        run: python scripts/test_update.py

      - name: 価格データを取得・検証・更新
        run: python scripts/update_prices.py

      - name: 変更があればコミットする
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "価格データに変更はありませんでした。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): 金価格データを更新 ($(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST'))"
          git push
